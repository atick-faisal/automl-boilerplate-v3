[project]
name = "automl-boilerplate-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atick Faisal", email = "atickfaisal@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
flaml = [
    "flaml[automl]>=2.6,<3",
]
autogluon = [
    "autogluon-tabular[catboost,lightgbm,xgboost]>=1.6,<1.7",
]
mlflow = [
    "mlflow-skinny>=3.16,<4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlflow>=3.16,<4",
    "pandas-stubs>=2.3,<2.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
# None of sklearn, AutoGluon or FLAML ship stubs; untyped values are handled in the adapter modules.
reportMissingTypeStubs = false
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107"]
per-file-ignores = { "tests/**" = ["D"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
