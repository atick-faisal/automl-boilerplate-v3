[project]
name = "automl-boilerplate-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atick Faisal", email = "atickfaisal@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
flaml = [
    "flaml[automl]>=2.6,<3",
]
autogluon = [
    "autogluon-tabular[catboost,lightgbm,xgboost]>=1.6,<1.7",
]
mlflow = [
    "mlflow-skinny>=3.16,<4",
]

[tool.uv]
# FLAML caps `xgboost<3.0.0`, which held the lock at xgboost 2.x. That xgboost's `save_model` reads
# `_estimator_type`, which scikit-learn deprecated in 1.6 and removed in 1.9 — so AutoGluon trains
# an XGBoost model and then dies saving it, and XGBoost silently vanishes from every leaderboard.
# AutoGluon itself allows `>=2.1.1,<3.4`. FLAML's cap looks stale rather than real: this package is
# regression-only, and its `xgboost` and `xgb_limitdepth` regression learners are verified working
# on xgboost 3.3.0. Drop this override if the `flaml` extra goes away or upstream lifts the cap.
override-dependencies = ["xgboost>=3,<3.4"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlflow>=3.16,<4",
    "pandas-stubs>=2.3,<2.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
# None of sklearn, AutoGluon or FLAML ship stubs; untyped values are handled in the adapter modules.
reportMissingTypeStubs = false
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107"]
per-file-ignores = { "tests/**" = ["D"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
